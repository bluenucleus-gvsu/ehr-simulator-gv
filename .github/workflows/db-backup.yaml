# To download a backup, use the GitHub Actions UI or run this:
# gh run download --name <backup-name>
name: Supabase DB Backup

on:
  schedule:
    - cron: '0 2 * * *' # Every day at 2:00 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    name: Dump & Upload
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Verify pg_dump version
        run: pg_dump --version

      - name: Run pg_dump
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +"%Y-%m-%dT%H-%M-%SZ")
          /usr/lib/postgresql/17/bin/pg_dump \
            --no-owner \
            --no-acl \
            --format=custom \
            "${{ secrets.SUPABASE_DB_URL }}" \
            -f "backups/backup-${TIMESTAMP}.dump"
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.TIMESTAMP }}
          path: backups/
          retention-days: 90 # Free plan is 90 days
          if-no-files-found: error